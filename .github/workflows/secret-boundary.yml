name: Secret Boundary

on:
  push:
    branches: [ main, part2-without-opa-godbot-v3 ]
  pull_request:
    branches: [ main, part2-without-opa-godbot-v3 ]

permissions:
  contents: read

jobs:
  secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "/tmp/${archive}" "${url}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove the scanner detects a seeded credential
        run: |
          set +e
          printf 'api_key = "AKIA%s%s"\n' '12345678' '90ABCDEF' |
            gitleaks stdin --config .gitleaks.toml --redact --no-banner --log-level error
          scan_result=$?
          set -e
          if [ "${scan_result}" -ne 1 ]; then
            echo "Gitleaks failed to detect the synthetic credential canary" >&2
            exit 1
          fi

      - name: Scan Git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install CDK and application dependencies
        run: |
          npm install --global aws-cdk@2.1148.1
          pip install -r requirements.txt

      - name: Generate and test security-boundary artifacts
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1
        run: |
          cdk --app "python3 app.py" synth --quiet
          python -m pytest \
            tests/test_auth_hardening.py \
            tests/test_dashboard.py \
            tests/test_m2m_secret_boundary.py \
            tests/test_scripts_token.py \
            --basetemp="${RUNNER_TEMP}/secret-boundary-pytest" \
            -q

      - name: Scan synthesized templates and dashboard artifacts
        run: |
          gitleaks dir cdk.out --config .gitleaks.toml --redact --no-banner
          gitleaks dir dashboard/public --config .gitleaks.toml --redact --no-banner
