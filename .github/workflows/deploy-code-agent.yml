name: Deploy code-agent

# A2A runtime. Refuses to run while agents.a2a is false in platform.yaml.

on:
  workflow_dispatch:
    inputs:
      action:
        description: verify invokes this agent. deploy also updates its runtime.
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-agent.yml
    with:
      component: code-agent
      action: ${{ inputs.action }}
    secrets: inherit
