name: Control Library

on:
  push:
    branches: [ main ]
    paths:
      - 'control-library/**'
      - 'infra_utils/policy_loader.py'
      - 'scripts/validate_control_library.py'
      - 'scripts/ci/control-library.lock'
      - 'scripts/pip-install-locked.sh'
      - 'requirements.lock'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'control-library/**'
      - 'infra_utils/policy_loader.py'
      - 'scripts/validate_control_library.py'
      - 'scripts/ci/control-library.lock'
      - 'scripts/pip-install-locked.sh'
      - 'requirements.lock'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate-control-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # checkov pins an older boto3 than requirements.txt allows, so it gets
      # its own venv and only its entry point goes on PATH.
      - name: Install dependencies
        run: |
          bash scripts/pip-install-locked.sh requirements.lock
          python -m venv "$RUNNER_TEMP/checkov"
          bash scripts/pip-install-locked.sh scripts/ci/control-library.lock "$RUNNER_TEMP/checkov/bin/python"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/checkov/bin/checkov" "$RUNNER_TEMP/bin/checkov"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate control-library against catalog (+ checkov scan)
        run: python scripts/validate_control_library.py

      - name: Run policy_loader unit tests
        run: python -m pytest tests/ -q

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform fmt -check -recursive control-library/terraform/

      - name: Terraform validate (org-guardrails)
        working-directory: control-library/terraform/org-guardrails
        run: |
          terraform init -backend=false -input=false
          terraform validate
