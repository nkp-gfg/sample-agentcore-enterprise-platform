name: Documentation Integrity

on:
  push:
    branches: [ main, part2-without-opa-godbot-v3 ]
  pull_request:
    branches: [ main, part2-without-opa-godbot-v3 ]

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check local links, navigation, and site assets
        run: python scripts/check_docs.py

      - name: Check repository capability boundaries
        run: python scripts/check_repository_structure.py
