# use-cases/hr-tools/policy/authz.rego with the OPA CLI. The version here
# matches the pin in .gitlab-ci.yml; bump both together.
"ubi:open-policy-agent/opa" = { version = "1.22.4", exe = "opa" }

[env]
_.python.venv = { path = ".venv", create = true }