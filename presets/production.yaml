# Production starting point: secure controls are mandatory and stateful
# resources are retained. Replace every sentinel before deploying; synthesis
# with placeholders is only a CI parity check, not production approval.
project: agentcore-production
environment: prod
region: us-east-1

deployment:
  mode: production
  strategy: centralized
  platform_account: "000000000000"

identity:
  idp: entra_id
  mode: brokered
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: REPLACE_ME
  client_secret_name: agentcore/idp-client-secret

agents:
  pattern: strands-agent
  # Choose any Bedrock model that is available in `region` and supports tool
  # use. Deploy injects model_id as MODEL_ID into every runtime, and the
  # runtime role may invoke only the models in allowed_models (model_id must be
  # one of them). The example below runs in-region (no prefix) in us-east-1,
  # eu-west-1, eu-central-1, and eu-north-1. A prefixed id (us., eu., apac.,
  # global.) is a cross-region profile: Bedrock then serves calls from other
  # regions, and a region-deny SCP must allow those regions. List the options:
  #   aws bedrock list-foundation-models --region <region> --by-inference-type ON_DEMAND
  #   aws bedrock list-inference-profiles --region <region>
  model_id: openai.gpt-oss-120b-1:0
  allowed_models:
    - openai.gpt-oss-120b-1:0
  memory:
    event_expiry_days: 30

gateway:
  # Production requires an explicit decision instead of region-dependent auto.
  web_search: "off"
  tools: [sample-tool]

security:
  networking: true
  cloudtrail_alerting: true
  resource_policies: true
  egress_filter: true
  require_guardrails: true
  cedar:
    enabled: true
    mode: ENFORCE
  traceability: true
  org_id: o-example1234

observability:
  transaction_search: true
  alarms: true
  alarm_email: ops@REPLACE_ME.invalid
  log_retention_days: 90
