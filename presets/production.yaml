# Production starting point: secure controls are mandatory and stateful
# resources are retained. Replace every sentinel before deploying; synthesis
# with placeholders is only a CI parity check, not production approval.
project: agentcore-production
environment: prod
region: us-east-1

deployment:
  mode: production
  strategy: centralized
  platform_account: "000000000000"

identity:
  idp: entra_id
  mode: brokered
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: REPLACE_ME
  client_secret_name: agentcore/idp-client-secret

agents:
  pattern: strands-agent
  # EU geo profile. Deploy injects model_id as MODEL_ID, which overrides the
  # container DEFAULT_MODEL_ID. Leaving the old us.anthropic.claude-sonnet-4-6
  # value here would send production inference to US regions even after the
  # agent code defaults changed. eu.anthropic.claude-sonnet-4-6 was ACTIVE in
  # eu-west-1 on 2026-11-13 and routes only to eu-west-1, eu-central-1,
  # eu-west-3, eu-north-1, eu-south-1, and eu-south-2. allowed_models must
  # contain model_id or production validation rejects the file.
  model_id: eu.anthropic.claude-sonnet-4-6
  allowed_models:
    - eu.anthropic.claude-sonnet-4-6
  memory:
    event_expiry_days: 30

gateway:
  # Production requires an explicit decision instead of region-dependent auto.
  web_search: "off"
  tools: [sample-tool]

security:
  networking: true
  cloudtrail_alerting: true
  resource_policies: true
  egress_filter: true
  require_guardrails: true
  cedar:
    enabled: true
    mode: ENFORCE
  traceability: true
  org_id: o-example1234

observability:
  transaction_search: true
  alarms: true
  alarm_email: ops@REPLACE_ME.invalid
  log_retention_days: 90
