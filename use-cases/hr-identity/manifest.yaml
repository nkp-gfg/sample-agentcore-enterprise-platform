name: hr-identity
owner: hr-platform
summary: >-
  Pre-token-generation V3_0 Lambda on the module 3 Cognito user pool. Looks up
  the signed-in employee in the hr-data Aurora cluster and adds the
  employee_id, user_id, role, and agent_id claims used by Cedar and the HR
  tool Lambdas.
requires: [auth, networking]
stacks: [uc-hr-identity]
entry: stack.py
