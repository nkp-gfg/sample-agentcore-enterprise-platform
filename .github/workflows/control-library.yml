name: Control Library

on:
  push:
    branches: [ main ]
    paths:
      - 'control-library/**'
      - 'infra_utils/policy_loader.py'
      - 'scripts/validate_control_library.py'
      - 'tests/**'
      - '.github/requirements/checkov.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'control-library/**'
      - 'infra_utils/policy_loader.py'
      - 'scripts/validate_control_library.py'
      - 'tests/**'
      - '.github/requirements/checkov.txt'

permissions:
  contents: read

jobs:
  validate-control-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt checkov -c .github/requirements/checkov.txt

      - name: Validate control-library against catalog (+ checkov scan)
        run: python scripts/validate_control_library.py

      - name: Run policy_loader unit tests
        run: python -m pytest tests/ -q

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform fmt -check -recursive control-library/terraform/

      - name: Terraform validate (org-guardrails)
        working-directory: control-library/terraform/org-guardrails
        run: |
          terraform init -backend=false -input=false
          terraform validate
