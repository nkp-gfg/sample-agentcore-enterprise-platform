# Adapted from fullstack-solution-template-for-agentcore
name: Python Code Quality

on:
  push:
    branches: [ main, part2-without-opa-godbot-v3 ]
  pull_request:
    branches: [ main, part2-without-opa-godbot-v3 ]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed Python files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          json: true
          escape_json: false
          files: |
            **/*.py

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install ruff
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install ruff==0.17.5

      - name: Run ruff check on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          printf '%s' "${ALL_CHANGED_FILES}" | jq -e -j '.[] + "\u0000"' > /tmp/changed_files.nul
          mapfile -d '' -t files < /tmp/changed_files.nul
          echo "Checking changed Python files:"
          printf '%s\n' "${files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            ruff check --output-format=github "${files[@]}"
          fi

      - name: Run ruff format check on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          printf '%s' "${ALL_CHANGED_FILES}" | jq -e -j '.[] + "\u0000"' > /tmp/changed_files.nul
          mapfile -d '' -t files < /tmp/changed_files.nul
          if [ "${#files[@]}" -gt 0 ]; then
            ruff format --check "${files[@]}"
          fi

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No Python files changed - skipping linting"
