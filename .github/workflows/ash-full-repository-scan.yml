# Adapted from fullstack-solution-template-for-agentcore
name: ASH Full Repository Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_findings: ${{ steps.scan-summary.outputs.has_findings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # ASH v3.2.2 source archive for commit 65ac41970da8207d4457aeada0ba27065aaf43a8.
      # Keep the URL, digest, and the copy in ash-security-scan.yml in sync.
      - name: Install ASH
        run: |
          set -e -o pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ash.tar.gz" \
            https://codeload.github.com/awslabs/automated-security-helper/tar.gz/65ac41970da8207d4457aeada0ba27065aaf43a8
          echo "eac4104bb76704b96de7623eb559a6e233ea8d5133c9d86dc1259437d12454a3  $RUNNER_TEMP/ash.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ash"
          tar -xzf "$RUNNER_TEMP/ash.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/ash"
          pip install "$RUNNER_TEMP/ash"

      # Any revision other than LOCAL makes ASH clone itself by tag while building the scan image.
      - name: Run ASH full repository scan
        run: |
          cat > .ash_config.yaml << 'EOF'
          reporters:
            markdown:
              enabled: true
              options:
                include_detailed_findings: true
                max_detailed_findings: 1000
          EOF
          (cd "$RUNNER_TEMP/ash" && ash --mode container --ash-revision-to-install LOCAL \
            --source-dir "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/.ash/ash_output" \
            --config .ash_config.yaml) 2>&1 | tee ash-output.log
        continue-on-error: true

      - name: Generate scan summary
        id: scan-summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          SUMMARY_FILE="ash-summary.md"
          echo "# ASH Security Scan - Full Repository Report" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "**Scan Date:** $(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$SUMMARY_FILE"
          echo "**Trigger:** ${EVENT_NAME}" >> "$SUMMARY_FILE"
          if [ -f "ash-output.log" ]; then
            TABLE_START=$(grep -n "ASH Scan Results Summary" ash-output.log | head -1 | cut -d: -f1 || echo "0")
            TABLE_END=$(grep -n "source-dir:" ash-output.log | head -1 | cut -d: -f1 || echo "0")
            if [ "$TABLE_START" != "0" ] && [ "$TABLE_END" != "0" ] && [ "$TABLE_END" -gt "$TABLE_START" ]; then
              echo "## Scanner Results" >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              echo "| Scanner | S | C | H | M | L | I | Time | Action | Result | Thresh |" >> "$SUMMARY_FILE"
              echo "|---------|---|---|---|---|---|---|------|--------|--------|--------|" >> "$SUMMARY_FILE"
              sed -n "${TABLE_START},${TABLE_END}p" ash-output.log | \
              sed 's/\x1b\[[0-9;]*m//g' | grep "^│" | sed 's/│/|/g' >> "$SUMMARY_FILE"
            fi
            if grep -q "Actionable findings detected!" ash-output.log; then
              echo "has_findings=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_findings=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload ASH results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ash-full-scan-${{ github.run_id }}
          path: |
            .ash/
            ash-output.log
            ash-summary.md
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          echo "## ASH Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "ash-summary.md" ]; then cat ash-summary.md >> $GITHUB_STEP_SUMMARY; fi

  report-issue:
    needs: full-scan
    if: github.event_name == 'schedule' && needs.full-scan.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download ASH results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash-full-scan-${{ github.run_id }}

      - name: Create issue for critical findings (monthly scan)
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('ash-summary.md')) {
              const body = fs.readFileSync('ash-summary.md', 'utf8');
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🔒 ASH Monthly Security Report (${new Date().toISOString().split('T')[0]})`,
                body: body + '\n\n---\n*Auto-created by monthly security scan.*',
                labels: ['security', 'automated-scan']
              });
            }
